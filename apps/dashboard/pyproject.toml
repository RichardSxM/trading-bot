[project]
name = "dashboard"
version = "0.1.0"
description = "Private web dashboard. Reads Postgres and Redis; never imports NautilusTrader."
requires-python = ">=3.14,<3.15"
dependencies = [
    "trading-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "itsdangerous>=2.2",
    "redis>=5.2",
    "tzdata>=2025.2",
    "qrcode>=8.0",
]

[project.scripts]
dashboard = "dashboard.main:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "types-qrcode>=8.0", "pyyaml>=6.0", "types-pyyaml>=6.0"]

[tool.pytest.ini_options]
# Tests that need a running service are opt in (a later -m overrides this one).
addopts = "-m 'not redis'"
markers = [
    "redis: needs the Compose Redis and this service's mounted password (run with -m redis)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]
