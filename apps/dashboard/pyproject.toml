[project]
name = "dashboard"
version = "0.1.0"
description = "Private web dashboard. Reads Postgres and Redis; never imports NautilusTrader."
requires-python = ">=3.14,<3.15"
dependencies = [
    "trading-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
dashboard = "dashboard.main:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]
