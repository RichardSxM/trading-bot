{% extends "base.html" %}
{% block body %}
<header class="topbar">
  <span class="badge badge--{{ env }}" role="status">{{ env | upper }}</span>
  <div class="topbar__live" hx-ext="sse" sse-connect="/events">
    <span class="topbar__age" sse-swap="topbar-age">{{ live["topbar-age"] }}</span>
  </div>
  {% if session_end %}<span class="topbar__session">session ends {{ session_end }}</span>{% endif %}
  <form class="topbar__logout" method="post" action="/logout">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="button">Log out</button>
  </form>
</header>
<main class="page" id="main">
  <h1 class="page__title">{{ title }}</h1>
  {% block page %}{% endblock %}
</main>
{% endblock %}
