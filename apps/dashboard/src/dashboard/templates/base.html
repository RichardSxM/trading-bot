<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ env | upper }} · {{ title }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon-{{ env }}.svg">
  <link rel="preload" href="/static/fonts/barlow-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  {% block head %}{% endblock %}
  <script defer src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/htmx-ext-sse.min.js"></script>
  <script defer src="/static/js/shell.js"></script>
  {% block scripts %}{% endblock %}
</head>
<body class="env-{{ env }}">
{% block body %}{% endblock %}
</body>
</html>
