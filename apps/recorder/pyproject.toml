[project]
name = "recorder"
version = "0.1.0"
description = "Nautilus node that records L2 book deltas and trades into the catalog."
requires-python = ">=3.14,<3.15"
dependencies = ["trading-core[node]"]

[project.scripts]
recorder = "recorder.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recorder"]
