# The donchian_scalp candle screen (spec 0025 AC-13): the demo's 5 minute donchian, measured for the first
# time, as the baseline r1 is compared against. Spec 0018's shared study settings as in connors_rsi_15m.toml,
# and the demo config with no grid, so it makes one trial in the scalping family. Committed before it first
# runs. Run it only through `lab study studies/donchian_scalp.toml`, then `lab screen donchian_scalp`.
# The plan is frozen by name: change anything here and give the study a new name.
instrument_id = "PF_XBTUSD.KRAKEN"
from = 2022-04-01                    # first whole month after the 2022-03-24 floor
to = 2025-10-18                      # the day before holdout_start
seed = 7                             # the run seed (look ahead cut times)
stale_quote_s = 300
maker_fee = "0.0002"
taker_fee = "0.0005"
slippage_bps = "2"
starting_balance_usd = "10000"
leverage = "2"

[risk]                               # every value written out, none left to a default
max_order_notional = "20000"
max_leverage = "2"
max_total_exposure = "20000"
risk_per_trade = "0.005"
maintenance_margin_rate = "0.01"
min_liq_distance_pct = "10"
liq_stop_multiple = "3"
stop_slippage_bps = "5"              # the sizing's assumed stop slippage, separate from slippage_bps

[strategy]
name = "donchian_scalp"
[strategy.config]                    # the demo's settings (trader/paper_strategy.py); no grid, one base run
bar_spec = "5-MINUTE-LAST"
entry_bars = 20
stop_atr = "3"
atr_period = 14
atr_floor_mult = "1"
time_stop_bars = 60                  # 5 hours of 5 minute bars

[study]
name = "donchian_scalp"
lab = "candle"
seed = 42                            # the gate's bootstrap seed
