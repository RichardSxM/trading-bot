# The known loser (spec 0015 task 12): random_taker as a replay study over free Tardis days only (AC-24).
source = "tardis"                    # "tardis" | "own"
instrument_id = "PF_XBTUSD.KRAKEN"
from = 2022-04-01                    # the first whole Tardis day; development is every 1st up to 2025-10-01
to = 2025-10-18                      # the day before holdout_start; the plan sets the ranges
seed = 7
maker_fee = "0.0002"                 # strings, parsed as Decimal
taker_fee = "0.0005"
latency_ms = 25
starting_balance_usd = "10000"
leverage = "2"

[risk]                               # RiskLimits (spec 0006 check_entry), same field names
max_order_notional = "2000"
max_leverage = "2"

[strategy]
name = "random_taker"                # a key of the lab strategy registry
[strategy.config]                    # fields of that strategy's StrategyConfig
interval_s = 60
hold_s = 30
notional_usd = "1000"                # quantity = notional ÷ mid, floored to size_increment

[study]
name = "random_taker"
lab = "replay"                       # replay folds: 15 days in sample first, then 7 day steps
entry_mode = "taker"                 # random_taker has no entry_mode setting, so taker only
seed = 42                            # the bootstrap's seed
