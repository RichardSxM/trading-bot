# The donchian_4h_r1 candle study (spec 0020.3 Revision 1, AC-12): donchian_4h's one revision, the same
# rule and grid on 1 hour bars, with spec 0018's shared hour level study settings unchanged, committed
# before the study first runs. Run it only through `lab study studies/donchian_4h_r1.toml`, then
# `lab holdout donchian_4h_r1` (spec 0020 AC-9): never `lab backtest` it on real candles, so every look at
# real data is a counted trial. Its results are labelled "holdout seen", and the revision is final.
instrument_id = "PF_XBTUSD.KRAKEN"
from = 2022-04-01                    # first whole month after the 2022-03-24 floor
to = 2025-10-18                      # the day before holdout_start
seed = 7                             # the run seed (look ahead cut times)
stale_quote_s = 300
maker_fee = "0.0002"
taker_fee = "0.0005"
slippage_bps = "2"
starting_balance_usd = "10000"
leverage = "2"

[risk]                               # every value written out, none left to a default
max_order_notional = "20000"
max_leverage = "2"
max_total_exposure = "20000"
risk_per_trade = "0.005"
maintenance_margin_rate = "0.01"
min_liq_distance_pct = "10"
liq_stop_multiple = "3"
stop_slippage_bps = "5"              # the sizing's assumed stop slippage, separate from slippage_bps

[strategy]
name = "donchian_4h_r1"
[strategy.config]                    # the revision's fixed settings (spec 0020.3 Revision 1)
bar_spec = "1-HOUR-LAST"
atr_period = 14
atr_floor_mult = "1"
time_stop_bars = 240                 # 10 days of 1 hour bars
[strategy.grid]                      # 2 × 2 = 4 points; every point is a trial
entry_bars = [20, 55]
stop_atr = ["2", "3"]

[study]
name = "donchian_4h_r1"
lab = "candle"
seed = 42                            # the gate's bootstrap seed
