# The tsmom candle study (spec 0027 child 2 AC-18): long only daily time series momentum on BTC, ETH,
# SOL and XRP in one shared account, with a 4 point lookback grid, committed before the study first runs.
# Run it only through `lab study studies/tsmom.toml`, then `lab holdout tsmom` once (spec 0027 AC-19):
# never `lab backtest` it on real candles, so every look at real data is a counted trial (AC-22). The
# plan is frozen by name: change anything here and it is a revision.
instrument_ids = ["PF_ETHUSD.KRAKEN", "PF_SOLUSD.KRAKEN", "PF_XBTUSD.KRAKEN", "PF_XRPUSD.KRAKEN"]
from = 2022-04-01                    # first whole month all four coins have candles (verify.md AC-16)
to = 2025-10-18                      # the day before holdout_start
seed = 7                             # the run seed (look ahead cut times)
stale_quote_s = 300
maker_fee = "0.0002"
taker_fee = "0.0005"
slippage_bps = "2"
starting_balance_usd = "10000"
leverage = "2"

[risk]                               # donchian_4h_pair.toml's block, value for value
max_order_notional = "20000"
max_leverage = "2"
max_total_exposure = "20000"
risk_per_trade = "0.005"
maintenance_margin_rate = "0.01"
min_liq_distance_pct = "10"
liq_stop_multiple = "3"
stop_slippage_bps = "5"              # the sizing's assumed stop slippage, separate from slippage_bps

[strategy]
name = "tsmom"
[strategy.config]                    # the candidate's fixed settings (spec 0027 child 2 AC-18)
bar_spec = "1-DAY-LAST"
atr_period = 20
atr_floor_mult = "1"
time_stop_bars = 30                  # funding is budgeted over the whole planned hold
stop_atr = "3"
long_only = true                     # written out: the gate reads it from the version config
[strategy.grid]                      # 4 points; every point is a trial
lookback_days = [20, 30, 40, 60]

[study]
name = "tsmom"
lab = "candle"
seed = 42                            # the gate's bootstrap seed
