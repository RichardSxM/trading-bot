# The noise_breakout candle study (spec 0020.1, AC-8): spec 0018's shared hour level study settings
# unchanged, plus the candidate's fixed settings and its 3 point grid, committed before the study first
# runs. Run it only through `lab study studies/noise_breakout.toml`, then `lab holdout noise_breakout`
# (spec 0020 AC-9): never `lab backtest` noise_breakout on real candles, so every look at real data is a
# counted trial. The plan is frozen by name: change anything here and it is a revision (AC-12).
instrument_id = "PF_XBTUSD.KRAKEN"
from = 2022-04-01                    # first whole month after the 2022-03-24 floor
to = 2025-10-18                      # the day before holdout_start
seed = 7                             # the run seed (look ahead cut times)
stale_quote_s = 300
maker_fee = "0.0002"
taker_fee = "0.0005"
slippage_bps = "2"
starting_balance_usd = "10000"
leverage = "2"

[risk]                               # every value written out, none left to a default
max_order_notional = "20000"
max_leverage = "2"
max_total_exposure = "20000"
risk_per_trade = "0.005"
maintenance_margin_rate = "0.01"
min_liq_distance_pct = "10"
liq_stop_multiple = "3"
stop_slippage_bps = "5"              # the sizing's assumed stop slippage, separate from slippage_bps

[strategy]
name = "noise_breakout"
[strategy.config]                    # the candidate's fixed settings (spec 0020.1 Settings)
bar_spec = "30-MINUTE-LAST"
atr_period = 14
atr_floor_mult = "1"
time_stop_bars = 16                  # 8 hours of 30 minute bars
lookback_days = 14
[strategy.grid]                      # 3 points; every point is a trial
band_mult = ["1", "1.5", "2"]

[study]
name = "noise_breakout"
lab = "candle"
seed = 42                            # the gate's bootstrap seed
