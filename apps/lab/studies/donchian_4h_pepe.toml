# The donchian_4h_pepe candle study: an exploratory look at donchian_4h.toml on PEPE alone, outside
# spec 0022 and outside the gate (the user asked for it on 2026-10-28). Every setting matches
# donchian_4h.toml except the coin, the start, and slippage_bps (5, not 2, for PEPE's thinner book).
# Run it only through `lab study studies/donchian_4h_pepe.toml`, then `lab holdout donchian_4h_pepe`:
# never `lab backtest` it on real candles, so every look at real data is a counted trial. The plan is
# frozen by name: change anything here and it is a revision.
instrument_id = "PF_PEPEUSD.KRAKEN"
from = 2023-06-01                    # first whole month after PF_PEPEUSD opened on 2023-05-25
to = 2025-10-18                      # the day before holdout_start
seed = 7                             # the run seed (look ahead cut times)
stale_quote_s = 300
maker_fee = "0.0002"
taker_fee = "0.0005"
slippage_bps = "5"
starting_balance_usd = "10000"
leverage = "2"

[risk]                               # every value written out, none left to a default
max_order_notional = "20000"
max_leverage = "2"
max_total_exposure = "20000"
risk_per_trade = "0.005"
maintenance_margin_rate = "0.01"
min_liq_distance_pct = "10"
liq_stop_multiple = "3"
stop_slippage_bps = "5"              # the sizing's assumed stop slippage, separate from slippage_bps

[strategy]
name = "donchian_4h"
[strategy.config]                    # the candidate's fixed settings (spec 0020.3 Settings)
bar_spec = "4-HOUR-LAST"
atr_period = 14
atr_floor_mult = "1"
time_stop_bars = 60                  # 10 days of 4 hour bars
[strategy.grid]                      # 2 × 2 = 4 points; every point is a trial
entry_bars = [20, 55]
stop_atr = ["2", "3"]

[study]
name = "donchian_4h_pepe"
lab = "candle"
seed = 42                            # the gate's bootstrap seed
