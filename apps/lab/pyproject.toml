[project]
name = "lab"
version = "0.1.0"
description = "Laptop only replay lab: recorded order books through the Nautilus backtest engine (spec 0008)."
requires-python = ">=3.14,<3.15"
dependencies = ["trading-core[node]"]

[project.scripts]
lab = "lab.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Tests that need the Compose Postgres are opt in (a later -m overrides this one).
addopts = "-m 'not postgres'"
markers = [
    "postgres: needs the Compose Postgres and the lab_app password (run with -m postgres)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]
