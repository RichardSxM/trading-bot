[project]
name = "trader"
version = "0.1.0"
description = "Nautilus node that holds positions: strategies, risk, execution."
requires-python = ">=3.14,<3.15"
dependencies = ["trading-core[node]"]

[project.scripts]
trader = "trader.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]
