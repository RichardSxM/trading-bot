# One Compose file for the laptop (demo: live market data, sandbox execution, Docker
# Desktop 4.41.2) and the VPS.
# Settings come from .env (copy .env.example), but only through ${VAR} substitution: no
# service loads .env whole. Each one gets just the variables listed for it below.
# Secrets are never variables (spec 0003): each is a file in ${SECRETS_DIR} (./secrets on the
# laptop, made by scripts/dev-secrets.sh; /etc/kfs/secrets on the VPS), mounted read only at
# /run/secrets/<name> into only the services listed below. The live Kraken key is added only
# by compose.live.yaml.
# No service publishes a port on 0.0.0.0: only the dashboard, on the host's 127.0.0.1,
# exposed to the tailnet with `tailscale serve`.
# Image names (spec 0005): ${KFS_IMAGE_PREFIX}<app>:${KFS_TAG}. On the laptop both are unset,
# so images stay kfs/<app>:<IMAGE_TARGET> and are built locally. On the VPS, kfs-compose sets
# KFS_TAG to the deployed commit and /etc/kfs/kfs.env sets the GHCR prefix; nothing is built there.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  restart: unless-stopped
  logging: *logging

# Defaults match trading_core.settings.Settings. TRADING_ENV has no default on purpose:
# when it is unset the process itself refuses to start.
x-base-env: &base-env
  TRADING_ENV: ${TRADING_ENV:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CLOCK_SERVERS: ${CLOCK_SERVERS:-0.pool.ntp.org,1.pool.ntp.org,2.pool.ntp.org}
  MAX_CLOCK_OFFSET_MS: ${MAX_CLOCK_OFFSET_MS:-250}
  # The catalog disk limits (spec 0007): retention keeps the free floor, the recorder stops at the
  # hard floor. Shared, so the recorder and the compactor each check the pair at start.
  CATALOG_FREE_FLOOR_GB: ${CATALOG_FREE_FLOOR_GB:-8}
  CATALOG_HARD_FLOOR_GB: ${CATALOG_HARD_FLOOR_GB:-2}

x-postgres-env: &postgres-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-trading}
  POSTGRES_USER: ${POSTGRES_USER:-trading}

x-app-db-env: &app-db-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-trading}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}

x-node-healthcheck: &node-healthcheck
  # Heartbeat actor touches the file every 10 s; healthy while it is under 30 s old.
  test: ["CMD", "python", "-m", "trading_core.health", "/run/heartbeat/alive", "30"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 90s

services:
  clock:
    # Laptop only: keeps the Docker Desktop VM clock synced, since it drifts while the Mac
    # sleeps and the nodes then fail their startup clock check. Started only with the
    # `laptop` profile (COMPOSE_PROFILES=laptop in the laptop's .env); the VPS never sets it,
    # and the container refuses to run on anything but the Docker Desktop VM anyway.
    profiles: ["laptop"]
    build:
      context: .
      dockerfile: docker/clock/Dockerfile
    image: kfs/clock:local
    restart: unless-stopped
    logging: *logging
    # Only the right to set the clock, nothing more.
    cap_add:
      - SYS_TIME
    healthcheck:
      # Healthy once synced with under 0.1 s left to correct.
      test: ["CMD", "chronyc", "-n", "waitsync", "1", "0.1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 32m

  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      # Read only when the volume is first initialised; scripts/set-pg-owner-password.sh
      # applies a changed file to an existing volume.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: UTC
      PGTZ: UTC
    secrets:
      - source: postgres_owner_password
        target: postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    logging: *logging
    # One ACL user per service from the hashed password files (spec 0003); see docker/redis/start.sh.
    entrypoint: ["/usr/local/bin/kfs-redis-start"]
    command: ["--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
      - ./docker/redis/start.sh:/usr/local/bin/kfs-redis-start:ro
    tmpfs:
      - /run/redis-acl
    secrets:
      - redis_trader_password
      - redis_dashboard_password
      - redis_alerter_password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  migrate:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${IMAGE_TARGET:-runtime}
      args:
        PACKAGE: trading-core
        APP_DIR: packages/core
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${KFS_IMAGE_PREFIX:-kfs/}core:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    restart: "no"
    # Role setup first (idempotent), then the schema, both as the owner role.
    command: ["sh", "-c", "python -m trading_core.db_roles && alembic upgrade head"]
    environment:
      <<: [*base-env, *postgres-env]
      PROCESS_NAME: migrate
    # The owner password, plus every role password for role setup (the only service with all three).
    secrets:
      - source: postgres_owner_password
        target: postgres_password
      - postgres_trader_password
      - postgres_dashboard_password
      - postgres_backup_password
      - postgres_alerter_password
      # Optional: without it the lab role is created NOLOGIN. compose.vps.yaml leaves it out.
      - postgres_lab_password
      # The promotion gate's role (spec 0015); scripts/dev-secrets.sh makes it on the laptop.
      - postgres_gate_password
    depends_on:
      # Only where the laptop profile runs it (the clock service); ignored on the VPS.
      clock:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
    mem_limit: 256m

  trader:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${IMAGE_TARGET:-runtime}
      args:
        PACKAGE: trader
        APP_DIR: apps/trader
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${KFS_IMAGE_PREFIX:-kfs/}trader:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    command: ["python", "-m", "trader.main"]
    # Kraken keys are added by compose.live.yaml only; no other service ever gets them.
    # An explicit TRADER_ID goes in a compose override: an empty value would be refused.
    environment:
      <<: [*base-env, *redis-env, *app-db-env]
      PROCESS_NAME: trader
      POSTGRES_USER: trader_app
      REDIS_USERNAME: trader
      # The paper loop (spec 0006): placeholder strategy, risk caps, sandbox, recording.
      PAPER_STRATEGY: ${PAPER_STRATEGY:-placeholder_timed}
      PLACEHOLDER_INTERVAL_MIN: ${PLACEHOLDER_INTERVAL_MIN:-15}
      PLACEHOLDER_HOLD_MIN: ${PLACEHOLDER_HOLD_MIN:-10}
      PLACEHOLDER_LOOKBACK_MIN: ${PLACEHOLDER_LOOKBACK_MIN:-5}
      PLACEHOLDER_STOP_PCT: ${PLACEHOLDER_STOP_PCT:-0.3}
      RISK_MAX_ORDER_NOTIONAL_USD: ${RISK_MAX_ORDER_NOTIONAL_USD:-250}
      RISK_MAX_LEVERAGE: ${RISK_MAX_LEVERAGE:-2}
      RISK_STALE_QUOTE_S: ${RISK_STALE_QUOTE_S:-10}
      # The guard (spec 0011): risk sizing, total exposure, liquidation distance.
      RISK_PER_TRADE: ${RISK_PER_TRADE:-0.005}
      RISK_MAX_TOTAL_EXPOSURE_USD: ${RISK_MAX_TOTAL_EXPOSURE_USD:-500}
      RISK_MAINTENANCE_MARGIN_RATE: ${RISK_MAINTENANCE_MARGIN_RATE:-0.01}
      RISK_MIN_LIQ_DISTANCE_PCT: ${RISK_MIN_LIQ_DISTANCE_PCT:-10}
      RISK_LIQ_STOP_MULTIPLE: ${RISK_LIQ_STOP_MULTIPLE:-3}
      RISK_STOP_SLIPPAGE_BPS: ${RISK_STOP_SLIPPAGE_BPS:-5}
      STOP_ACCEPT_TIMEOUT_S: ${STOP_ACCEPT_TIMEOUT_S:-5}
      # The kill switch and loss limits (spec 0010). The total counts losses since this UTC date.
      # RISK_TOTAL_LOSS_SINCE has no default on purpose: unset reaches the trader empty, and it
      # refuses to start (set it in .env on the laptop, /etc/kfs/kfs.env on the VPS).
      RISK_DAILY_LOSS_LIMIT_USD: ${RISK_DAILY_LOSS_LIMIT_USD:-20}
      RISK_TOTAL_LOSS_LIMIT_USD: ${RISK_TOTAL_LOSS_LIMIT_USD:-100}
      RISK_TOTAL_LOSS_SINCE: ${RISK_TOTAL_LOSS_SINCE:-}
      RISK_MAX_TRADES_PER_DAY: ${RISK_MAX_TRADES_PER_DAY:-50}
      RISK_LOSS_COOLDOWN_S: ${RISK_LOSS_COOLDOWN_S:-600}
      KILL_SWITCH_FLAT_TIMEOUT_S: ${KILL_SWITCH_FLAT_TIMEOUT_S:-20}
      RECONCILE_INTERVAL_S: ${RECONCILE_INTERVAL_S:-60}
      RECONCILE_RETRY_S: ${RECONCILE_RETRY_S:-5}
      RECONCILE_START_TIMEOUT_S: ${RECONCILE_START_TIMEOUT_S:-300}
      RECONCILE_FETCH_TIMEOUT_S: ${RECONCILE_FETCH_TIMEOUT_S:-10}
      RECONCILE_LOOKBACK_MINS: ${RECONCILE_LOOKBACK_MINS:-1440}
      RECONCILE_NAUTILUS_TIMEOUT_S: ${RECONCILE_NAUTILUS_TIMEOUT_S:-30}
      SANDBOX_STARTING_BALANCE_USD: ${SANDBOX_STARTING_BALANCE_USD:-1000}
      SANDBOX_MAKER_FEE: ${SANDBOX_MAKER_FEE:-0.0002}
      SANDBOX_TAKER_FEE: ${SANDBOX_TAKER_FEE:-0.0005}
      SANDBOX_REJECT_STOP_ORDERS: ${SANDBOX_REJECT_STOP_ORDERS:-false}
      SANDBOX_REJECT_KILL_SWITCH_ORDERS: ${SANDBOX_REJECT_KILL_SWITCH_ORDERS:-false}
      SANDBOX_DELAY_ENTRY_FILLS_S: ${SANDBOX_DELAY_ENTRY_FILLS_S:-0}
      RECORDING_MAX_BACKLOG_S: ${RECORDING_MAX_BACKLOG_S:-30}
      RECORDING_QUEUE_MAX: ${RECORDING_QUEUE_MAX:-10000}
      RECORDING_DRAIN_S: ${RECORDING_DRAIN_S:-5}
      SPOOL_DIR: /data/spool
    secrets:
      - source: postgres_trader_password
        target: postgres_password
      - source: redis_trader_password
        target: redis_password
    volumes:
      - catalog:/data/catalog:ro
      # Records the trader could not write before it stopped; replayed at the next start (spec 0006 AC-13).
      - trader-spool:/data/spool
    depends_on:
      clock:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck: *node-healthcheck
    # The kernel must never pick the process holding positions first.
    oom_score_adj: -900
    stop_grace_period: 30s
    mem_limit: 1g

  recorder:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${IMAGE_TARGET:-runtime}
      args:
        PACKAGE: recorder
        APP_DIR: apps/recorder
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${KFS_IMAGE_PREFIX:-kfs/}recorder:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    command: ["python", "-m", "recorder.main"]
    # No Redis, no Postgres, never Kraken keys (the env guard refuses them in any env).
    environment:
      <<: *base-env
      PROCESS_NAME: recorder
      CATALOG_PATH: /data/catalog
      RECORDER_INSTRUMENTS: ${RECORDER_INSTRUMENTS:-PF_XBTUSD.KRAKEN}
      RECORDER_QUEUE_WARN_PCT: ${RECORDER_QUEUE_WARN_PCT:-50}
      RECORDER_SEQUENCE_CONFIRM_S: ${RECORDER_SEQUENCE_CONFIRM_S:-600}
      # true on the VPS (compose.vps.yaml): refuse to start without the extra disk's marker (spec 0005).
      CATALOG_REQUIRE_MARKER: ${CATALOG_REQUIRE_MARKER:-false}
    volumes:
      - catalog:/data/catalog
    depends_on:
      clock:
        condition: service_healthy
        required: false
    healthcheck:
      <<: *node-healthcheck
      # Heartbeat, a book delta file written in the last 60 s, and free space above the hard
      # floor (spec 0007 AC-7).
      test: ["CMD", "python", "-m", "recorder.health"]
    # The stop (1 s post stop, up to 10 s for the clients to disconnect, then dispose) must reach
    # writer.close, which writes what the buffered writer still holds (spec 0012 AC-5). Docker's
    # default 10 s ends in SIGKILL first.
    stop_grace_period: 30s
    # 2026-10-08: at 3.2 GB/h of market data the data queue stays full and Nautilus parks every
    # overflowing message in a pending put(), which grew past 768m and got the recorder killed
    # every 5 minutes. The room lets a burst drain instead (late rows are repaired, spec 0007 AC-12).
    mem_limit: 1536m

  # Turns closed feather hours into the Parquet catalog (spec 0007). Same image as the recorder,
  # no network and no secrets; one core at nice 19, so the trader always wins the CPU.
  compactor:
    <<: *app
    image: ${KFS_IMAGE_PREFIX:-kfs/}recorder:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    # The lowest priority inside its container; cpu_shares is what yields the CPU to the
    # recorder and the trader (spec 0007 AC-14).
    command: ["nice", "-n", "19", "python", "-m", "recorder.compactor.main"]
    environment:
      <<: *base-env
      PROCESS_NAME: compactor
      CATALOG_PATH: /data/catalog
      CLOCK_SERVERS: ""  # no network: the worker clock check only warns
      CATALOG_REQUIRE_MARKER: ${CATALOG_REQUIRE_MARKER:-false}
      CATALOG_CAP_GB: ${CATALOG_CAP_GB:-30}
      # False: the catalog is not copied to B2, so retention keeps only the newest day safe. True
      # makes it wait for the backup's catalog step and delete only hours older than its cutoff.
      CATALOG_NEEDS_BACKUP: ${CATALOG_NEEDS_BACKUP:-false}
      BACKUP_STATE_PATH: /state/catalog_backup.json
      COMPACTOR_PARQUET_RATIO: ${COMPACTOR_PARQUET_RATIO:-0.042}
      COMPACTOR_GRACE_S: ${COMPACTOR_GRACE_S:-300}
      COMPACTOR_INTERVAL_S: ${COMPACTOR_INTERVAL_S:-60}
      BOOK_SILENCE_GAP_S: ${BOOK_SILENCE_GAP_S:-10}
      COMPACTOR_REORDER_WINDOW_S: ${COMPACTOR_REORDER_WINDOW_S:-600}
      COMPACTOR_REORDER_MAX_ROWS: ${COMPACTOR_REORDER_MAX_ROWS:-2000000}
      # The recorder's list: only these instruments must cover a day for it to close (spec 0007 AC-5).
      RECORDER_INSTRUMENTS: ${RECORDER_INSTRUMENTS:-PF_XBTUSD.KRAKEN}
    volumes:
      - catalog:/data/catalog
      - backup-state:/state:ro
    network_mode: none
    healthcheck:
      # The heartbeat is touched every 10 s during a pass and after each one.
      test: ["CMD", "python", "-m", "trading_core.health", "/run/heartbeat/alive", "180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 512m
    cpus: 1.0
    cpu_shares: 256  # a quarter of the default weight when the CPUs are busy

  dashboard:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${IMAGE_TARGET:-runtime}
      args:
        PACKAGE: dashboard
        APP_DIR: apps/dashboard
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${KFS_IMAGE_PREFIX:-kfs/}dashboard:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    command: ["python", "-m", "dashboard.main"]
    environment:
      <<: [*base-env, *redis-env, *app-db-env]
      PROCESS_NAME: dashboard
      POSTGRES_USER: dashboard_app
      REDIS_USERNAME: dashboard
      # spec 0004; DASHBOARD_COOKIE_SECURE=false only in demo, for a browser on http://127.0.0.1.
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-true}
      DASHBOARD_STALE_AMBER_S: ${DASHBOARD_STALE_AMBER_S:-3}
      DASHBOARD_STALE_RED_S: ${DASHBOARD_STALE_RED_S:-10}
      DASHBOARD_POLL_MS: ${DASHBOARD_POLL_MS:-500}
      DASHBOARD_SESSION_IDLE_H: ${DASHBOARD_SESSION_IDLE_H:-24}
      DASHBOARD_SESSION_MAX_D: ${DASHBOARD_SESSION_MAX_D:-7}
      CONTROL_COMMAND_TTL_S: ${CONTROL_COMMAND_TTL_S:-300}
      DASHBOARD_COMMAND_HIDE_S: ${DASHBOARD_COMMAND_HIDE_S:-900}
      DASHBOARD_ACK_WARN_S: ${DASHBOARD_ACK_WARN_S:-10}
    secrets:
      - source: postgres_dashboard_password
        target: postgres_password
      - source: redis_dashboard_password
        target: redis_password
      # The login (spec 0004): made by scripts/dashboard-credentials.sh, dashboard only.
      - dashboard_password_hash
      - dashboard_totp_seed
      - dashboard_session_key
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8000}:8000"
    volumes:
      - catalog:/data/catalog:ro
    depends_on:
      clock:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m

  alerter:
    # Phone alerts (spec 0013): turns the trader's heartbeat (and, in later milestones, the logs)
    # into Pushover pushes, and pings healthchecks.io while it is healthy. ALERTS_DELIVERY=log
    # (the laptop default) is a dry run: every push is logged, nothing is sent, no ping.
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${IMAGE_TARGET:-runtime}
      args:
        PACKAGE: alerter
        APP_DIR: apps/alerter
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${KFS_IMAGE_PREFIX:-kfs/}alerter:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    command: ["alerter"]
    environment:
      <<: [*base-env, *redis-env, *app-db-env]
      PROCESS_NAME: alerter
      POSTGRES_USER: alerter_app
      REDIS_USERNAME: alerter
      ALERTS_DELIVERY: ${ALERTS_DELIVERY:-log}
      ALERTS_TRADER_DOWN_S: ${ALERTS_TRADER_DOWN_S:-45}
      ALERTS_HOURLY_CAP: ${ALERTS_HOURLY_CAP:-30}
      ALERTS_RENOTIFY_S: ${ALERTS_RENOTIFY_S:-3600}
      ALERTS_CRITICAL_RENOTIFY_S: ${ALERTS_CRITICAL_RENOTIFY_S:-14400}
      ALERTS_ENTRY_BLOCK_S: ${ALERTS_ENTRY_BLOCK_S:-3600}
      ALERTS_DISK_FREE_GB: ${ALERTS_DISK_FREE_GB:-5}
      ALERTS_DAILY_AT: ${ALERTS_DAILY_AT:-08:00}
      ALERTS_DAILY_TZ: ${ALERTS_DAILY_TZ:-Europe/Amsterdam}
      ALERTS_DOCKER_URL: http://docker-proxy:2375
    # The default network for Postgres and Redis; dockerproxy only to reach the socket proxy.
    networks:
      - default
      - dockerproxy
    secrets:
      - source: postgres_alerter_password
        target: postgres_password
      - source: redis_alerter_password
        target: redis_password
      # Loaded only with ALERTS_DELIVERY=pushover; placeholders on the laptop.
      - pushover_app_token
      - pushover_user_key
      - hc_alerter_url
    depends_on:
      clock:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    healthcheck:
      <<: *node-healthcheck
      start_period: 30s
    mem_limit: 128m

  docker-proxy:
    # The alerter's only door to Docker (spec 0013, *Security model*): GET on the container
    # listing, inspect, and logs and nothing else. Our own haproxy template replaces the image's
    # allow list, whose CONTAINERS=1 would also allow archive and export (other containers'
    # files, secrets included); see docker/docker-proxy/haproxy.cfg.template. The socket is
    # mounted read only and the proxy sits alone with the alerter on the internal dockerproxy network.
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    logging: *logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/docker-proxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - dockerproxy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # haproxy renders its config into /tmp at start.
    tmpfs:
      - /tmp
      - /run
    # Healthy while the one allowed listing call answers through the proxy to the socket.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/containers/json?limit=1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m

  backup:
    # Nightly at BACKUP_AT_UTC: downsample_snapshots(), pg_dump, manifest, restic (spec 0005 AC-19).
    # The laptop keeps a local restic repository in the staging volume; the VPS sets a B2 one.
    # `kfs-backup once` in the running container runs one backup now.
    <<: *app
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${KFS_IMAGE_PREFIX:-kfs/}backup:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    command: ["kfs-backup", "loop"]
    environment:
      <<: *app-db-env
      POSTGRES_USER: backup_app
      TRADING_ENV: ${TRADING_ENV:-}
      KFS_TAG: ${KFS_TAG:-unknown}
      # Unset means the laptop's local repository; set but empty (kfs.env) refuses to start.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY-/staging/restic-repo}
      BACKUP_AT_UTC: ${BACKUP_AT_UTC:-02:30}
      BACKUP_STALE_H: ${BACKUP_STALE_H:-26}
      TZ: UTC
    secrets:
      - source: postgres_backup_password
        target: postgres_password
      - restic_password
      - b2_key_id
      - b2_application_key
      # The healthchecks.io `backup-verified` ping URL (spec 0013 AC-5); a placeholder on the laptop.
      - hc_backup_url
    # The catalog is added on the VPS only (compose.vps.yaml): the laptop's copy is not the record.
    volumes:
      - backup-staging:/staging
      # catalog_backup.json, the catalog snapshot's cutoff the compactor's retention reads (spec 0007 AC-8).
      - backup-state:/state
    # The Postgres password file and the start marker the health check reads; reset on every start.
    tmpfs:
      - /run/kfs:uid=10001,gid=10001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kfs-backup", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 384m

  dashboard-credentials:
    # Never started by `up`: run through scripts/dashboard-credentials.sh (spec 0004 AC-19).
    # Mounts no secrets, so it works before they exist; writes into the host secrets folder.
    profiles: ["tools"]
    image: ${KFS_IMAGE_PREFIX:-kfs/}dashboard:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    restart: "no"
    network_mode: none
    command: ["python", "-m", "dashboard.credentials"]
    volumes:
      - ${SECRETS_DIR:-./secrets}:/out

  tools:
    # Never started by `up`: run on demand, e.g. `docker compose run --rm tools scripts/typecheck.sh`.
    # The repo is bind mounted over /app, so it checks your working tree without a rebuild.
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tools
      args:
        PACKAGE: trader
        APP_DIR: .
    image: kfs/tools:latest
    restart: "no"
    network_mode: none
    environment:
      MYPY_CACHE_DIR: /cache/mypy
    volumes:
      - .:/app
      - tools-cache:/cache

  gate:
    # The promotion gate (spec 0015), never started by `up`: run it as `kfs-compose run --rm gate import`
    # or `gate evaluate <study>` on the VPS. Core only (no NautilusTrader), so it runs in either
    # TRADING_ENV; what it imports is always demo. Reads the bundle files scripts/push-bundles.sh copies.
    profiles: ["gate"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${IMAGE_TARGET:-runtime}
      args:
        PACKAGE: gate
        APP_DIR: apps/gate
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${KFS_IMAGE_PREFIX:-kfs/}gate:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    restart: "no"
    logging: *logging
    entrypoint: ["gate"]
    environment:
      <<: [*base-env, *app-db-env]
      PROCESS_NAME: gate
      POSTGRES_USER: gate_app
      GATE_BUNDLE_DIR: /bundles
    secrets:
      - source: postgres_gate_password
        target: postgres_password
    volumes:
      - ${GATE_BUNDLE_HOST_DIR:-./lab-reports}:/bundles:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m

  lab:
    # Laptop only replay lab (spec 0008), never started by `up` and never deployed: run it as
    # `docker compose run --rm lab replay <runfile>` (import, parity, and prune take --no-deps).
    profiles: ["lab"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${IMAGE_TARGET:-runtime}
      args:
        PACKAGE: lab
        APP_DIR: apps/lab
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${KFS_IMAGE_PREFIX:-kfs/}lab:${KFS_TAG:-${IMAGE_TARGET:-runtime}}
    restart: "no"
    logging: *logging
    entrypoint: ["lab"]
    environment:
      <<: [*base-env, *app-db-env]
      PROCESS_NAME: lab
      # Demo only: the lab refuses live with exit 78 (AC-17).
      TRADING_ENV: demo
      POSTGRES_USER: lab_app
      # Fixed hash order, so the same replay gives the same output (AC-12). Set on this
      # service only, so the other services keep hash randomization.
      PYTHONHASHSEED: "0"
      LAB_CATALOG_DIR: /catalog-lab
      LAB_REPORTS_DIR: /lab-reports
      LAB_CATALOG_CAP_GB: ${LAB_CATALOG_CAP_GB:-40}
      LAB_WORKERS: ${LAB_WORKERS:-2}
      LAB_TARDIS_DAY_GB: ${LAB_TARDIS_DAY_GB:-3}
      # Public, unauthenticated Kraken Futures GETs for the candle lab (spec 0014 AC-5).
      LAB_KRAKEN_FUTURES_URL: ${LAB_KRAKEN_FUTURES_URL:-https://futures.kraken.com}
      LAB_KRAKEN_PAUSE_MS: ${LAB_KRAKEN_PAUSE_MS:-250}
    secrets:
      - source: postgres_lab_password
        target: postgres_password
    volumes:
      - ./catalog-lab:/catalog-lab
      - ./lab-reports:/lab-reports
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Two workers at under 1 GB each plus the parent, inside the laptop's 4 GB Docker VM (AC-16).
    mem_limit: 3g

networks:
  # Internal: no route out, shared only by the alerter and the socket proxy.
  dockerproxy:
    internal: true

secrets:
  postgres_owner_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_owner_password
  postgres_trader_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_trader_password
  postgres_dashboard_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_dashboard_password
  postgres_backup_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_backup_password
  # Laptop only (spec 0008), so not under SECRETS_DIR: the VPS deploy requires every
  # ${SECRETS_DIR}/<name> file it finds here (deploy/host/lib.sh kfs_secret_names).
  postgres_lab_password:
    file: ./secrets/postgres_lab_password
  redis_trader_password:
    file: ${SECRETS_DIR:-./secrets}/redis_trader_password
  redis_dashboard_password:
    file: ${SECRETS_DIR:-./secrets}/redis_dashboard_password
  postgres_alerter_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_alerter_password
  postgres_gate_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_gate_password
  redis_alerter_password:
    file: ${SECRETS_DIR:-./secrets}/redis_alerter_password
  pushover_app_token:
    file: ${SECRETS_DIR:-./secrets}/pushover_app_token
  pushover_user_key:
    file: ${SECRETS_DIR:-./secrets}/pushover_user_key
  hc_alerter_url:
    file: ${SECRETS_DIR:-./secrets}/hc_alerter_url
  hc_backup_url:
    file: ${SECRETS_DIR:-./secrets}/hc_backup_url
  dashboard_password_hash:
    file: ${SECRETS_DIR:-./secrets}/dashboard_password_hash
  dashboard_totp_seed:
    file: ${SECRETS_DIR:-./secrets}/dashboard_totp_seed
  dashboard_session_key:
    file: ${SECRETS_DIR:-./secrets}/dashboard_session_key
  restic_password:
    file: ${SECRETS_DIR:-./secrets}/restic_password
  b2_key_id:
    file: ${SECRETS_DIR:-./secrets}/b2_key_id
  b2_application_key:
    file: ${SECRETS_DIR:-./secrets}/b2_application_key

volumes:
  tools-cache:
  pgdata:
  redisdata:
  catalog:
  trader-spool:
  backup-staging:
  backup-state:
