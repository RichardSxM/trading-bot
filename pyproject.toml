[project]
name = "kraken-futures-scalper"
version = "0.1.0"
description = "Workspace root for the Kraken Futures scalper (trader, recorder, dashboard)."
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
# ruff is pinned to the same version as the hook in .pre-commit-config.yaml; bump both together.
dev = ["pytest>=8", "ruff==0.16.9", "mypy==2.3.1"]
research = ["duckdb>=1.1", "jupyterlab>=4"]

[tool.uv]
package = false
# The lock resolves against the Linux wheels the containers use, even when
# `uv lock` runs on the Intel Mac (NautilusTrader has no Intel Mac wheel).
environments = ["sys_platform == 'linux'"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
trading-core = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".claude"]

[tool.ruff.lint]
# DTZ catches naive datetimes (the UTC everywhere rule).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "DTZ", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["trading_core", "trader", "recorder", "dashboard", "lab", "alerter", "gate"]

# Strict everywhere; scripts/typecheck.sh runs it once per workspace package, inside Linux
# (NautilusTrader has no Intel Mac wheel).
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Parts of NautilusTrader are compiled Cython with no stubs. Only modules mypy cannot find
# are affected; the typed parts stay checked. Subclassing an untyped Nautilus base gets a
# narrow `# type: ignore[misc]` on that line.
[[tool.mypy.overrides]]
module = ["nautilus_trader.*"]
ignore_missing_imports = true

# pyarrow ships no type information (spec 0007's compactor reads and writes Arrow and Parquet).
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ijson ships no type information (spec 0015's gate import streams large lab bundles with it).
[[tool.mypy.overrides]]
module = ["ijson", "ijson.*"]
ignore_missing_imports = true
