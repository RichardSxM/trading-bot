[project]
name = "trading-core"
version = "0.1.0"
description = "Shared config, logging, clock check, naming, and database models for every process."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
# Only the processes that run a Nautilus node (trader, recorder, lab) install this. pyarrow and
# numpy come with Nautilus; `trading_core.catalog` imports them directly, so they are named too.
# websockets is the raw public context feed's client (spec 0009 AC-3), pinned exactly.
node = ["nautilus_trader==1.231.0", "pyarrow", "numpy", "websockets==17.2"]

[tool.pytest.ini_options]
# Integration tests need the Compose Postgres; run them in the migrate service with
# `pytest -q -m integration` (a later -m overrides this one).
addopts = "-m 'not integration'"
markers = ["integration: needs the Compose Postgres (run in the migrate service)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_core"]
