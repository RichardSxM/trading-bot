[project]
name = "trading-core"
version = "0.1.0"
description = "Shared config, logging, clock check, naming, and database models for every process."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
# Only the processes that run a Nautilus node (trader, recorder) install this.
node = ["nautilus_trader==1.231.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_core"]
