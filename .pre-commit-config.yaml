# gitleaks and ruff run on every commit; mypy runs once before each push, because on a Mac it is
# slow (it needs NautilusTrader, so scripts/typecheck.sh hands it to the Linux `tools` container,
# and Docker must be running). CI runs the same mypy on every push and PR.
# Install once on the host: `uv tool install pre-commit && pre-commit install` (both hook types).
# Run mypy by hand: `pre-commit run --all-files --hook-stage pre-push`. Skip it in a pinch: SKIP=mypy git push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # keep in step with GITLEAKS_VERSION in .github/workflows/ci.yml (spec 0003)
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9 # keep in step with ruff in pyproject.toml's dev group
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, in the tools container)
        entry: scripts/typecheck.sh
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
