# Short polls so the clock is right again soon after the Mac wakes from sleep.
server time.cloudflare.com iburst minpoll 4 maxpoll 6
pool pool.ntp.org iburst minpoll 4 maxpoll 6 maxsources 3

# Step (jump) whenever the clock is off by more than 0.1 s, as often as needed: sleep
# leaves the VM behind by far more than slewing could fix before the startup clock check.
makestep 0.1 -1

# chronyc talks over the local socket only; no UDP command port.
cmdport 0
