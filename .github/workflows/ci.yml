name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Linux, because NautilusTrader only ships wheels there (and the lock targets Linux).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_VERSION: "0.12.21" # same as docker/Dockerfile
      GITLEAKS_VERSION: "8.30.1" # same as the gitleaks hook in .pre-commit-config.yaml
      # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file; bump with the version.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: gitleaks (no secret in any commit, spec 0003)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync every workspace package
        run: uv sync --frozen --all-packages --group dev

      - name: Ruff lint
        run: uv run --frozen ruff check --output-format=github .

      - name: Ruff format
        run: uv run --frozen ruff format --check .

      - name: mypy (strict)
        run: uv run --frozen scripts/typecheck.sh

      - name: pytest
        run: |
          for pkg in packages/core apps/trader apps/recorder apps/dashboard apps/lab; do
            echo "::group::pytest $pkg"
            (cd "$pkg" && uv run --frozen pytest -q)
            echo "::endgroup::"
          done

      # Deselected by default (apps/trader/pyproject.toml); needs no Redis or network.
      - name: canary leak test (no secret in any output, spec 0003 AC-6)
        working-directory: apps/trader
        run: uv run --frozen pytest -q -m canary

  # The images the VPS deploys (spec 0005 AC-3): one per app, tagged with the commit CI tested.
  # Only on a push to main; no other branch builds an image, and there is no `latest` tag.
  images:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: core, file: docker/Dockerfile, package: trading-core, app_dir: packages/core }
          - { app: trader, file: docker/Dockerfile, package: trader, app_dir: apps/trader }
          - { app: recorder, file: docker/Dockerfile, package: recorder, app_dir: apps/recorder }
          - { app: dashboard, file: docker/Dockerfile, package: dashboard, app_dir: apps/dashboard }
          # Its own Dockerfile (spec 0005 AC-19); it ignores PACKAGE and APP_DIR.
          - { app: backup, file: docker/backup/Dockerfile, package: "", app_dir: "" }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push kfs-${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: runtime
          build-args: |
            PACKAGE=${{ matrix.package }}
            APP_DIR=${{ matrix.app_dir }}
            GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/richardsxm/kfs-${{ matrix.app }}:${{ github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Keep the newest 10 versions of kfs-${{ matrix.app }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: kfs-${{ matrix.app }}
          package-type: container
          min-versions-to-keep: 10
