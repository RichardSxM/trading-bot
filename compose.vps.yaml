# VPS only override (spec 0005). Never used on the laptop. Always applied through
# kfs-compose, which also sets the project name `kfs`, the env file /etc/kfs/kfs.env, and
# KFS_TAG (the deployed commit).
#
# The catalog lives on the extra disk at /srv/kfs (mounted by bootstrap.sh) instead of a
# named volume, so it survives a lost Docker data root and the backup can read it.

services:
  # The lab never runs on the VPS (spec 0008), so its password file does not exist here and
  # role setup creates lab_app NOLOGIN. Same list as compose.yaml, minus postgres_lab_password.
  migrate:
    secrets: !override
      - source: postgres_owner_password
        target: postgres_password
      - postgres_trader_password
      - postgres_dashboard_password
      - postgres_backup_password
      - postgres_alerter_password
      - postgres_gate_password

  # No default here: a missing ALERTS_DELIVERY line in /etc/kfs/kfs.env refuses the deploy
  # instead of silently running the VPS alerter dry (spec 0013).
  # The host log folder, read only: host.jsonl and deploys.jsonl (the deploy window, autoheal,
  # rollbacks), and the root filesystem's free space. A folder, not file binds, so logrotate's
  # copytruncate and a recreated file stay visible (spec 0013 Build plan 3.1, 3.2).
  alerter:
    environment:
      ALERTS_DELIVERY: ${ALERTS_DELIVERY:?set ALERTS_DELIVERY=pushover in /etc/kfs/kfs.env}
    volumes:
      - type: bind
        source: /var/log/kfs
        target: /host/kfs-log
        read_only: true
        bind:
          create_host_path: true

  # The bundle files scripts/push-bundles.sh copies over Tailscale SSH (spec 0015 AC-7).
  gate:
    volumes: !override
      - type: bind
        source: /var/lib/kfs/bundles
        target: /bundles
        read_only: true
        bind:
          create_host_path: true

  recorder:
    environment:
      CATALOG_REQUIRE_MARKER: "true"
    volumes:
      - type: bind
        source: /srv/kfs/catalog
        target: /data/catalog
        bind:
          create_host_path: true

  compactor:
    environment:
      CATALOG_REQUIRE_MARKER: "true"
    volumes:
      - type: bind
        source: /srv/kfs/catalog
        target: /data/catalog
        bind:
          create_host_path: true

  trader:
    volumes:
      - type: bind
        source: /srv/kfs/catalog
        target: /data/catalog
        read_only: true
        bind:
          create_host_path: true

  dashboard:
    volumes:
      - type: bind
        source: /srv/kfs/catalog
        target: /data/catalog
        read_only: true
        bind:
          create_host_path: true

  # Read only: the catalog, the env file, and the deploy log go into the nightly snapshot
  # (spec 0005 AC-19). The two files must exist (bootstrap and the first deploy make them);
  # Docker would otherwise create a folder in their place.
  backup:
    volumes:
      - type: bind
        source: /srv/kfs/catalog
        target: /data/catalog
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /etc/kfs/kfs.env
        target: /host/kfs.env
        read_only: true
      - type: bind
        source: /var/log/kfs/deploys.jsonl
        target: /host/deploys.jsonl
        read_only: true
